spring.datasource.url=jdbc:postgresql://localhost:5432/digital_wallet
spring.datasource.username=wallet_user
spring.datasource.password=wallet_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=change-this-to-a-long-random-secret-key-at-least-32-characters
jwt.expiration=86400000